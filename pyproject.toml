    { name = "RONOH", email = "ronoelisha625@gmail.com"}
]
description = "KRA TIMS Integration for erpnext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

